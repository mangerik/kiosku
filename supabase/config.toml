project_id = "kiosku"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Temporary direct sign-up requested by the owner; restore true when re-enabling email verification.
enable_confirmations = false
max_frequency = "30s"
otp_length = 6
otp_expiry = 300

[auth.rate_limit]
email_sent = 10
sms_sent = 10
token_verifications = 30
sign_in_sign_ups = 30

[functions.checkout]
verify_jwt = false

[functions.payment-proof]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

[functions.billing-checkout]
verify_jwt = false

[functions.maintenance]
verify_jwt = false
